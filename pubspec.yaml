name: bivium
description: "A Flutter-based LQA & Translation tool that streamlines translation audits with real-time Google Sheets synchronization. "
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  google_sign_in: 6.2.1
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  flutter_native_splash: ^2.3.11
  uuid: ^4.4.0
  easy_localization: ^3.0.8
  styled_text: ^9.0.0
  firebase_core: ^4.4.0
  flutter_svg: ^2.2.3
  file_picker: ^10.3.10
  desktop_drop: ^0.7.0
  highlight: ^0.7.0
  flutter_code_editor: ^0.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # 모든 에셋은 하나의 assets 섹션에 모아야 합니다.
  assets:
    - assets/icon/
    - assets/NIKLdic/
    - assets/data/
    - assets/fonts/
    - assets/localization/
    - assets/wallpapers/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

    - family: NeoDGM
      fonts:
        - asset: assets/fonts/neodgm.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#212529"
    theme_color: "#212529"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48 
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#212529"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#212529"
  image: assets/icon/app_icon.png
  image_dark: assets/icon/app_icon.png
  android: true
  ios: true
  web: false